<!DOCTYPE html>
<html lang="pt-BR">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/almo.css">
</head>
<body id="rato"> 


  <nav id="navbar" class="navbar navbar-expand-lg ">
  <div class="container-fluid">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="/paginadois"> Início ‎ ‎ ‎ ‎ </a>

        </li>
      </ul>
    </div>
  </div>
</nav>

<div id=" tabela" class="container-foto">
    <table class="table table-bordered tabela-sobre-foto" id="tabelaProdutos">
        <thead>
            <tr id="cabecalho"></tr>
        </thead>
        <tbody id="corpo"></tbody>
    </table>
</div>

<img id="logodosenai" src="../static/senainovo.jpg" alt="logodosenai" />

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    fetch('/api/produtos')
        .then(response => response.json())
        .then(produtos => {
            const cabecalho = document.getElementById('cabecalho');
            Object.keys(produtos[0]).forEach(coluna => {
                const th = document.createElement('th');
                th.textContent = coluna;
                cabecalho.appendChild(th);
            });

            const corpo = document.getElementById('corpo');
            produtos.forEach(produto => {
                const tr = document.createElement('tr');
                Object.values(produto).forEach(valor => {
                    const td = document.createElement('td');
                    td.textContent = valor;
                    tr.appendChild(td);
                });
                corpo.appendChild(tr);
            });
        });
</script>
</body>
</html>
